<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
    --border: #d1d9e0; --code-bg: #f6f8fa; --link: #0969da;
    --blockquote: #59636e; --mark-bg: #fff8c5;
    --hl-kw: #cf222e; --hl-str: #0a3069; --hl-cmt: #6e7781;
    --hl-num: #0550ae; --hl-fn: #8250df; --hl-attr: #116329;
    --hl-meta: #953800; --hl-var: #e36209;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0;
      --border: #30363d; --code-bg: #161b22; --link: #4493f8;
      --blockquote: #8d96a0; --mark-bg: #4d3800;
      --hl-kw: #ff7b72; --hl-str: #a5d6ff; --hl-cmt: #8b949e;
      --hl-num: #79c0ff; --hl-fn: #d2a8ff; --hl-attr: #7ee787;
      --hl-meta: #ffa657; --hl-var: #ffa657;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  article {
    max-width: 860px; margin: 0 auto; padding: 40px 48px 80px;
    word-wrap: break-word;
  }
  h1, h2, h3, h4, h5, h6 {
    margin-top: 1.5em; margin-bottom: 0.6em; font-weight: 600; line-height: 1.25;
  }
  h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.25em; }
  h4 { font-size: 1em; }
  h5 { font-size: .875em; }
  h6 { font-size: .85em; color: var(--muted); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  p, ul, ol, blockquote, table, pre, details { margin-top: 0; margin-bottom: 16px; }
  ul, ol { padding-left: 2em; }
  li + li { margin-top: .25em; }
  li > input[type="checkbox"] { margin-right: .5em; }
  li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.4em; }
  blockquote {
    padding: 0 1em; color: var(--blockquote);
    border-left: .25em solid var(--border); margin-left: 0; margin-right: 0;
  }
  hr { height: .25em; padding: 0; margin: 24px 0; background-color: var(--border); border: 0; border-radius: 2px; }
  img { max-width: 100%; border-radius: 6px; }
  code, kbd {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 85%; background: var(--code-bg);
    padding: .2em .4em; border-radius: 6px;
  }
  pre {
    background: var(--code-bg); border-radius: 6px; padding: 16px;
    overflow-x: auto; line-height: 1.45;
  }
  pre code { background: transparent; padding: 0; font-size: 85%; white-space: pre; }
  table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: 6px 13px; }
  th { font-weight: 600; }
  tr:nth-child(2n) td { background: var(--code-bg); }
  mark { background: var(--mark-bg); color: var(--fg); }
  details.frontmatter {
    font-size: 13px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px;
  }
  details.frontmatter pre { margin: 8px 0 0; padding: 0; background: transparent; }
  /* highlight.js theme (GitHub-ish, both schemes via variables) */
  .hljs-keyword, .hljs-doctag, .hljs-template-tag, .hljs-type, .hljs-selector-tag { color: var(--hl-kw); }
  .hljs-string, .hljs-regexp, .hljs-quote { color: var(--hl-str); }
  .hljs-comment, .hljs-code { color: var(--hl-cmt); }
  .hljs-number, .hljs-literal, .hljs-attribute, .hljs-symbol, .hljs-bullet, .hljs-link, .hljs-selector-id, .hljs-selector-class { color: var(--hl-num); }
  .hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section, .hljs-name { color: var(--hl-fn); }
  .hljs-attr, .hljs-selector-attr, .hljs-selector-pseudo { color: var(--hl-attr); }
  .hljs-meta, .hljs-built_in { color: var(--hl-meta); }
  .hljs-variable, .hljs-template-variable, .hljs-params { color: var(--hl-var); }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: bold; }
</style>
<script>__MARKED_JS__</script>
<script>__HLJS_JS__</script>
<article id="content" class="markdown-body"></article>
<script>
  (function () {
    var raw = __MD_JSON__;

    var fm = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
    if (fm) { frontmatter = fm[1]; raw = raw.slice(fm[0].length); }

      var d = document.createElement('details');
